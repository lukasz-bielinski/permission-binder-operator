name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: operator

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          command -v shellcheck
          shellcheck --version

      - name: Run shellcheck on every tracked *.sh
        # Dialect, source resolution and the (justified) disabled codes live in
        # .shellcheckrc at the repository root; keep this command in sync with
        # the "Linting the scripts" section of example/tests/README.md.
        run: |
          shellcheck --severity=warning $(git ls-files '*.sh')

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Run unit and envtest suites
        working-directory: operator
        run: make test

      - name: Sync example manifests
        working-directory: operator
        run: make sync-examples

      - name: Check for uncommitted generated changes
        run: |
          # make test runs manifests/generate/fmt and make sync-examples updates
          # the example CRD copy; any resulting diff means generated files,
          # synced example manifests, or formatting were not committed
          git diff --exit-code || {
            echo "::error::make test or make sync-examples modified files - run 'make test' and 'make sync-examples' locally and commit the changes"
            exit 1
          }

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: operator/cover.out
          if-no-files-found: ignore
