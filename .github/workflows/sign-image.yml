name: Sign existing image

# Signs an already-published image digest with the repository cosign key pair.
# Use it to backfill releases built before key-pair signing existed, or to
# re-sign every supported release after a key rotation.

on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'Image digest to sign (sha256:<64 hex>), normally the index digest of a release tag'
        required: true
        type: string

env:
  IMAGE_NAME: lukaszbielinski/permission-binder-operator

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository (for cosign.pub)
        uses: actions/checkout@v7

      - name: Validate digest
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digest must look like sha256:<64 hex>, got '$DIGEST'"; exit 1; }

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          # Same pin as docker-build-push.yml: legacy `.sig` tag format for CRI-O.
          cosign-release: 'v2.6.5'

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign with key pair (index + every child manifest)
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ inputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          : "${COSIGN_PRIVATE_KEY:?COSIGN_PRIVATE_KEY secret is not set}"
          cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY "$IMAGE_REF"

      - name: Verify key-pair signature
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ inputs.digest }}
        run: |
          cosign verify --key cosign.pub "$IMAGE_REF" > /dev/null
          for d in $(docker buildx imagetools inspect --raw "$IMAGE_REF" | jq -r '.manifests[]?.digest'); do
            cosign verify --key cosign.pub "${IMAGE_NAME}@${d}" > /dev/null
            echo "verified ${d}"
          done
          echo "### Signed \`${IMAGE_REF}\` with key pair (cosign.pub)" >> "$GITHUB_STEP_SUMMARY"
